name: hono-handson

services:
  db:
    image: postgres:18-alpine
    ports:
      - "5434:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: hono_handson
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d hono_handson"]
      interval: 2s
      timeout: 5s
      retries: 15

  db-test:
    image: postgres:18-alpine
    ports:
      - "5435:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: hono_handson_test
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d hono_handson_test"]
      interval: 2s
      timeout: 5s
      retries: 15
